<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBlog - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>MyBlog</h1>
        <p>A simple place to read and share articles.</p>
        <nav>
            <a href="Index.html">Home</a> |
            <a href="articles.html">Articles</a> |
            <a href="create-article.html">Write Article</a> |
            <a href="profile.html">Profile</a> |
            <a href="login.html">Login</a> |
            <a href="register.html">Register</a>
        </nav>
        <hr>
    </header>
    <main>
        <section id="login">
            <h2>Login</h2>
            <form action="#" method="post">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" placeholder="Enter your password" required minlength="6">
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </section>
    </main>
    <footer>
        <hr>
        <h3>MyBlog</h3>
        <p>A simple blogging website built using HTML.</p>
        <p>&copy; 2026 MyBlog. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
